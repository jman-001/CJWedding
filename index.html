<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>¡Un momento! 💍</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f3ec;
      color: #3d3933;
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
    }

    .container {
      width: min(90%, 650px);
      padding: 60px 30px;
    }

    .ornament {
      font-size: 28px;
      letter-spacing: 8px;
      margin-bottom: 35px;
      opacity: 0.75;
    }

    h1 {
      margin: 0 0 25px;
      font-size: clamp(34px, 7vw, 58px);
      font-weight: normal;
      line-height: 1.15;
    }

    .message {
      font-size: clamp(18px, 3vw, 22px);
      line-height: 1.7;
      margin: 0 auto 35px;
      max-width: 520px;
    }

    .date {
      display: inline-block;
      margin-top: 10px;
      padding: 15px 30px;
      border-top: 1px solid #aaa39a;
      border-bottom: 1px solid #aaa39a;
      font-size: 18px;
      letter-spacing: 3px;
    }

    .small {
      margin-top: 35px;
      font-size: 15px;
      font-style: italic;
      opacity: 0.75;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="ornament">✦ · ✦</div>

    <h1>¡Sabemos que estás emocionado!</h1>

    <p class="message">
      Pero espera un poquito…<br>
      <strong>todavía no todos han recibido su invitación.</strong>
    </p>

    <p class="message">
      Estamos preparando todo para celebrar este día tan especial
      contigo.
    </p>

    <div class="date">
      1 · 10 · 2026
    </div>

    <p class="small">
      A partir del 1 de octubre podrás entrar y confirmar tu asistencia.
      <br><br>
      Nos vemos pronto. ♥
    </p>

  </main>

</body>
</html>
