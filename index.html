<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RSVP</title>

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="app-container">

        <!-- ================= HEADER ================= -->

        <header class="header">

            <div class="logo-container">
                <!-- Reemplazar posteriormente por el logo -->
                <h2>Wedding Logo</h2>
            </div>

            <div class="progress-section">

                <div class="progress-bar">

                    <div class="progress-fill" style="width: 12.5%;"></div>

                </div>

                <span class="progress-text">
                    Step 1 of 8
                </span>

            </div>

        </header>

        <!-- ================= MAIN ================= -->

        <main class="main-content">

            <!-- ================= PAGE 1 ================= -->

            <section id="welcome" class="page active">

                <div class="page-content">

                    <h1>Welcome!</h1>

                    <p>
                        We are so excited to celebrate this special day with you.
                    </p>

                    <p>
                        This short form will guide you through a few questions so we can
                        prepare everything for your visit.
                    </p>

                    <button class="primary-button">
                        Start
                    </button>

                </div>

            </section>

            <!-- ================= FUTURE PAGES ================= -->

        
            <section id="attendance" class="page">

                <div class="page-content">

                    <h1>Will you attend?</h1>

                    <p>Please let us know if you'll be joining us.</p>

                    <div class="option-group">

                        <button class="option-button" data-value="yes">
                            Yes
                        </button>

                        <button class="option-button" data-value="no">
                            No
                        </button>

                    </div>

                </div>

            </section>

        

        </main>

        <!-- ================= FOOTER ================= -->

        <footer class="footer">

            <button class="secondary-button" disabled>

                ← Back

            </button>

            <button class="primary-button">

                Next →

            </button>

        </footer>

    </div>

    <!-- Scripts -->

    <script src="js/navigation.js"></script>
    <script src="js/forms.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
